services:
  postgres:
    image: postgres:16-alpine
    container_name: interference_detection_postgres
    environment:
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom
      POSTGRES_DB: interference_detection
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d interference_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
