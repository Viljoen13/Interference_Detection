version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR per group instead of one per package
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.*"
          - "EFCore.*"
      testing:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "NSubstitute"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # Framework-aligned packages: keep on the same major line as EF Core.
      # Bump these together, deliberately, when moving the target framework.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
